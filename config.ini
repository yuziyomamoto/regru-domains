[settings]
; Дата возможного освобождения в формате ДД.ММ.ГГГГ (например, 15.10.2026)
target_date = 15.10.2026

; Формат вывода: txt (только список доменов по одному на строку) или csv (со всеми деталями)
output_format = txt

; Путь к файлу для сохранения результата.
; Если оставить пустым, имя сформируется автоматически: domains_ДД.ММ.ГГГГ.txt (или .csv)
output_file = 

; Задержка между запросами к reg.ru в секундах (рекомендуется 2.5 - 3.5 для избежания лимитов)
request_delay = 3.0

; Максимальное количество страниц для парсинга (0 — выгрузить все доступные страницы)
max_pages = 0
